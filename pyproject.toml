[project]
name = "complaint-triage"
version = "0.1.0"
description = "End-to-end complaint triage: CFPB data -> ML routing -> LLM response drafts -> deployed API"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "pandera>=0.20",
    "matplotlib>=3.7",
    "requests>=2.31",
    "tqdm>=4.66",
    "typer>=0.12",
    "tabulate>=0.9",
    "scikit-learn>=1.4",
    "mlflow>=2.14",
    "joblib>=1.3",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "rank_bm25>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
complaint_triage = ["ui.html"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E731", "E501", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/complaint_triage/profile.py" = ["F841"]  # `top` is used inside a pandas query string
