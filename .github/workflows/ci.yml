name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Train a small model so the image has something to serve
        run: 
	        pip install -e ".[dev]"          
          python scripts/ci_train_stub.py
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: complaint-triage:ci
      - name: Container smoke test
        run: |
          docker run -d --rm -p 8000:8000 --name ct complaint-triage:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          curl -sf -X POST http://127.0.0.1:8000/predict -H 'Content-Type: application/json' \
            -d '{"narrative":"Someone withdrew money from my checking account without authorization and the bank will not respond."}'
          docker stop ct
